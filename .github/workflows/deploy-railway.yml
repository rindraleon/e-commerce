name: Deploy Railway

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check whether Railway deploy is configured
        id: gate
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_BACKEND_SERVICE_ID: ${{ secrets.RAILWAY_BACKEND_SERVICE_ID }}
          RAILWAY_FRONTEND_SERVICE_ID: ${{ secrets.RAILWAY_FRONTEND_SERVICE_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            if [ "${{ github.event.workflow_run.conclusion }}" != "success" ] || [ "${{ github.event.workflow_run.head_branch }}" != "main" ]; then
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          elif [ "${{ github.ref_name }}" != "main" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$RAILWAY_BACKEND_SERVICE_ID" ] || [ -z "$RAILWAY_FRONTEND_SERVICE_ID" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Railway CLI
        if: steps.gate.outputs.enabled == 'true'
        run: npm install --global @railway/cli

      - name: Deploy backend service
        if: steps.gate.outputs.enabled == 'true'
        working-directory: backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE_ID: ${{ secrets.RAILWAY_BACKEND_SERVICE_ID }}
        run: railway up --service "$SERVICE_ID"

      - name: Deploy frontend service
        if: steps.gate.outputs.enabled == 'true'
        working-directory: frontend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE_ID: ${{ secrets.RAILWAY_FRONTEND_SERVICE_ID }}
        run: railway up --service "$SERVICE_ID"

      - name: Skip summary
        if: steps.gate.outputs.enabled != 'true'
        run: echo 'Railway deploy skipped (branch, CI status, or secrets not configured).'
